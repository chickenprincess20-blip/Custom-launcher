name: Compile Focus Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Ensure Gradle wrapper script is executable
      run: chmod +x gradlew

    - name: Compile Debug Launcher APK
      run: ./gradlew assembleDebug

    - name: Upload Completed APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FocusLauncher-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
