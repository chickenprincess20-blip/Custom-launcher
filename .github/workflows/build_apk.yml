name: Compile Focus Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Automatically Install and Setup Gradle Engine
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Fetch Clean Verified AndroidManifest
      run: |
        mkdir -p app/src/main
        curl -s https://github.com > app/src/main/AndroidManifest.xml

    - name: Purge Cache Mappings and Clean Workspace
      run: gradle clean

    - name: Compile Debug Launcher APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Completed APK to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FocusLauncher-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
